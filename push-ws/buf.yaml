version: v2
modules:

  - path: proto
    name: buf.build/serverlessinbox/mailbox-idl-push-ws
lint:

  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    - DIRECTORY_SAME_PACKAGE
