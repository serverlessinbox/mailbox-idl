version: '3'

tasks:
  jmap:generate:ts:
    desc: Generate TypeScript types for JMAP (output outside this repo)
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
    cmds:
      - task -d jmap generate:ts OUTPUT_DIR={{.OUTPUT_DIR}}

  jmap:generate:go:
    desc: Generate Go types for JMAP (output outside this repo)
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      PACKAGE: '{{default "jmapsdk" .PACKAGE}}'
    cmds:
      - task -d jmap generate:go OUTPUT_DIR={{.OUTPUT_DIR}} PACKAGE={{.PACKAGE}}

  admin-api:generate:go:
    desc: Generate Go server SDK for Admin API (output outside this repo)
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      GO_PACKAGE_PREFIX: '{{.GO_PACKAGE_PREFIX}}'
      GO_MODULE_TRIM: '{{.GO_MODULE_TRIM}}'
    cmds:
      - task -d admin-api generate:go OUTPUT_DIR={{.OUTPUT_DIR}} GO_PACKAGE_PREFIX={{.GO_PACKAGE_PREFIX}} GO_MODULE_TRIM={{.GO_MODULE_TRIM}}

  admin-api:generate:go:http-client:
    desc: Generate Go HTTP client SDK for Admin API (output outside this repo)
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      GO_PACKAGE_PREFIX: '{{.GO_PACKAGE_PREFIX}}'
      GO_MODULE_TRIM: '{{.GO_MODULE_TRIM}}'
      CLIENT_PACKAGE: '{{.CLIENT_PACKAGE | default "adminclient"}}'
      CLIENT_FILENAME: '{{.CLIENT_FILENAME | default "generated/adminclient/admin_api_http_client.pb.go"}}'
      COMPOUND_CLIENT: '{{.COMPOUND_CLIENT | default "false"}}'
      COMPOUND_CLIENT_FILENAME: '{{.COMPOUND_CLIENT_FILENAME | default "generated/adminclient/admin_api_client.pb.go"}}'
    cmds:
      - task -d admin-api generate:go:http-client OUTPUT_DIR={{.OUTPUT_DIR}} GO_PACKAGE_PREFIX={{.GO_PACKAGE_PREFIX}} GO_MODULE_TRIM={{.GO_MODULE_TRIM}} CLIENT_PACKAGE={{.CLIENT_PACKAGE}} CLIENT_FILENAME={{.CLIENT_FILENAME}} COMPOUND_CLIENT={{.COMPOUND_CLIENT}} COMPOUND_CLIENT_FILENAME={{.COMPOUND_CLIENT_FILENAME}}

  admin-api:generate:ts:
    desc: Generate TypeScript SDK for Admin API (output outside this repo; OUTPUT_DIR required)
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
    cmds:
      - task -d admin-api generate:ts OUTPUT_DIR={{.OUTPUT_DIR}}

  admin-api:lint:
    desc: Lint Admin API protobuf definitions
    cmds:
      - task -d admin-api lint

  admin-api:breaking:
    desc: Run breaking-change checks for Admin API protos
    cmds:
      - task -d admin-api breaking

  push-ws:generate:go:
    desc: Generate Go types for Push WS protocol (output outside this repo)
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      GO_PACKAGE_PREFIX: '{{.GO_PACKAGE_PREFIX}}'
      GO_MODULE_TRIM: '{{.GO_MODULE_TRIM}}'
    cmds:
      - task -d push-ws generate:go OUTPUT_DIR={{.OUTPUT_DIR}} GO_PACKAGE_PREFIX={{.GO_PACKAGE_PREFIX}} GO_MODULE_TRIM={{.GO_MODULE_TRIM}}

  push-ws:generate:ts:
    desc: Generate TypeScript types for Push WS protocol (output outside this repo)
    cmds:
      - task -d push-ws generate:ts OUTPUT_DIR={{.OUTPUT_DIR}}

  push-ws:lint:
    desc: Lint Push WS protobuf definitions
    cmds:
      - task -d push-ws lint

  push-ws:breaking:
    desc: Run breaking-change checks for Push WS protos
    cmds:
      - task -d push-ws breaking
