version: '3'

tasks:
  jmap:generate:ts:
    desc: Generate TypeScript types for JMAP (output outside this repo)
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
    cmds:
      - task -d jmap generate:ts OUTPUT_DIR={{.OUTPUT_DIR}}

  jmap:generate:go:
    desc: Generate Go types for JMAP (output outside this repo)
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      PACKAGE: '{{default "jmaptypes" .PACKAGE}}'
    cmds:
      - task -d jmap generate:go OUTPUT_DIR={{.OUTPUT_DIR}} PACKAGE={{.PACKAGE}}

  admin-api:generate:go:
    desc: Generate Go server SDK for Admin API (output outside this repo)
    cmds:
      - task -d admin-api generate:go OUTPUT_DIR={{.OUTPUT_DIR}}

  admin-api:generate:go:http-client:
    desc: Generate Go HTTP client SDK for Admin API (output outside this repo)
    cmds:
      - task -d admin-api generate:go:http-client OUTPUT_DIR={{.OUTPUT_DIR}}

  admin-api:generate:go:e2e:
    desc: Generate standalone Go E2E SDK for Admin API (protobuf types + HTTP client)
    cmds:
      - task -d admin-api generate:go:e2e OUTPUT_DIR={{.OUTPUT_DIR}}

  admin-api:generate:ts:
    desc: Generate TypeScript SDK for Admin API
    vars:
      OUTPUT_DIR: '{{default "../admin-ui/src/api/generated" .OUTPUT_DIR}}'
    cmds:
      - task -d admin-api generate:ts OUTPUT_DIR={{.OUTPUT_DIR}}

  admin-api:lint:
    desc: Lint Admin API protobuf definitions
    cmds:
      - task -d admin-api lint

  admin-api:breaking:
    desc: Run breaking-change checks for Admin API protos
    cmds:
      - task -d admin-api breaking
