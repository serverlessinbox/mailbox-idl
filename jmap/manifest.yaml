version: 1
capabilities:
  - urn:ietf:params:jmap:core
  - urn:ietf:params:jmap:mail
  - urn:ietf:params:jmap:submission
methods:
  - name: Mailbox/get
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Mailbox.get.args.schema.json
    responseSchema: schemas/methods/Mailbox.get.response.schema.json
  - name: Mailbox/changes
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Mailbox.changes.args.schema.json
    responseSchema: schemas/methods/Mailbox.changes.response.schema.json
  - name: Email/get
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Email.get.args.schema.json
    responseSchema: schemas/methods/Email.get.response.schema.json
    dx:
      resultRefs:
        accepts:
          - argKey: "#ids"
            targetArgPath: /ids
            source:
              method: Email/query
              responsePath: /ids
  - name: Email/changes
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Email.changes.args.schema.json
    responseSchema: schemas/methods/Email.changes.response.schema.json
  - name: Email/query
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Email.query.args.schema.json
    responseSchema: schemas/methods/Email.query.response.schema.json
    dx:
      resultRefs:
        provides:
          - responsePath: /ids

  - name: Email/queryChanges
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Email.queryChanges.args.schema.json
    responseSchema: schemas/methods/Email.queryChanges.response.schema.json

  - name: Email/set
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Email.set.args.schema.json
    responseSchema: schemas/methods/Email.set.response.schema.json

  - name: Thread/get
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Thread.get.args.schema.json
    responseSchema: schemas/methods/Thread.get.response.schema.json
  - name: Mailbox/set
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Mailbox.set.args.schema.json
    responseSchema: schemas/methods/Mailbox.set.response.schema.json

  - name: Mailbox/query
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Mailbox.query.args.schema.json
    responseSchema: schemas/methods/Mailbox.query.response.schema.json

  - name: Email/import
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Email.import.args.schema.json
    responseSchema: schemas/methods/Email.import.response.schema.json

  - name: Email/copy
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Email.copy.args.schema.json
    responseSchema: schemas/methods/Email.copy.response.schema.json

  - name: Email/parse
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Email.parse.args.schema.json
    responseSchema: schemas/methods/Email.parse.response.schema.json

  - name: Thread/query
