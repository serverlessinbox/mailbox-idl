    argsSchema: schemas/methods/Thread.query.args.schema.json
    responseSchema: schemas/methods/Thread.query.response.schema.json

  - name: Thread/changes
    capability: urn:ietf:params:jmap:mail
    argsSchema: schemas/methods/Thread.changes.args.schema.json
    responseSchema: schemas/methods/Thread.changes.response.schema.json

  - name: EmailSubmission/get
    capability: urn:ietf:params:jmap:submission
    argsSchema: schemas/methods/EmailSubmission.get.args.schema.json
    responseSchema: schemas/methods/EmailSubmission.get.response.schema.json

  - name: EmailSubmission/set
    capability: urn:ietf:params:jmap:submission
    argsSchema: schemas/methods/EmailSubmission.set.args.schema.json
    responseSchema: schemas/methods/EmailSubmission.set.response.schema.json

