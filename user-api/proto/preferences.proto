syntax = "proto3";

package userapi.v1;

// PreferencesService lets an authenticated user read and change their own display preferences.
// The caller is identified by the authentication context the request arrives with, never by a
// field in a message, so no request here names whose preferences are read or written.
service PreferencesService {
  // GetPreferences returns the caller's current preferences and the version they are stored at.
  // Pass the returned version as expected_version on the next UpdatePreferences call.
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse);

  // UpdatePreferences replaces the caller's stored preferences with the given document.
  // The write succeeds only if expected_version equals the version currently stored. A mismatch
  // means another write landed first; the caller must fetch again, re-apply its changes and retry.
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
}

// GetPreferencesRequest has no fields: the preferences returned are the caller's own.
message GetPreferencesRequest {}

// GetPreferencesResponse carries the caller's stored preferences and their version.
message GetPreferencesResponse {
  // The stored preferences. A field that is unset here has no stored value and the client
  // applies its own default.
  Preferences preferences = 1;

  // Monotonic version of the stored preferences. Zero means nothing has been stored yet.
  // Send it back as expected_version when writing.
  int64 version = 2;
}

// UpdatePreferencesRequest replaces the caller's stored preferences.
message UpdatePreferencesRequest {
  // The version the caller last read. Must equal the stored version for the write to apply.
  // Use 0 when no preferences have been stored yet, which makes the write create them.
  int64 expected_version = 1;

  // The complete new preferences document. The stored document is replaced by this one, so an
  // unset field is cleared rather than kept from the previous document.
  Preferences preferences = 2;
}

// UpdatePreferencesResponse confirms the write and reports the stored result.
message UpdatePreferencesResponse {
  // The preferences as stored after the write.
  Preferences preferences = 1;

  // The new version of the stored preferences. Use it as expected_version for the next write.
  int64 version = 2;
}

// Preferences is the set of user-adjustable display settings. Every field is optional so that
// a client can leave a setting at its default by not sending it.
message Preferences {
  // Colour theme for the web client. Unset means the client's default theme.
  optional Theme theme = 1;

  // Display language as a BCP 47 language tag (for example "en" or "nl-NL"). The server checks
  // the tag's shape only, not whether the language is supported by the client.
  optional string language = 2;
}

// Theme is the colour scheme the web client renders with.
enum Theme {
  // No theme chosen. Not a valid stored value for Preferences.theme; a field is left unset instead.
  THEME_UNSPECIFIED = 0;

  // Always use the light colour scheme.
  THEME_LIGHT = 1;

  // Always use the dark colour scheme.
  THEME_DARK = 2;

  // Follow the operating system's light or dark setting.
  THEME_AUTO = 3;
}
