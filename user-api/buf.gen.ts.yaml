# buf.gen.ts.yaml - TypeScript SDK generation (from protobuf)
version: v2
managed:
  enabled: true
  # The go_package override below is required even though this template generates
  # TypeScript output: the remote buf.build/bufbuild/es plugin and the local
  # protoc-gen-ts-client plugin are both Go-based tooling and refuse to run without a
  # resolvable go_package option on every file. The path value itself has no effect on
  # the generated TS.
  disable:
    - file_option: java_package
    - file_option: java_outer_classname
    - file_option: java_multiple_files
    - file_option: java_string_check_utf8
    - file_option: objc_class_prefix
    - file_option: csharp_namespace
    - file_option: php_namespace
    - file_option: php_metadata_namespace
    - file_option: ruby_package
    - file_option: optimize_for
    - file_option: cc_enable_arenas
  override:
    - file_option: go_package
      path: preferences.proto
      value: github.com/serverlessinbox/mailbox-idl/user-api/userapi;userapiv1
      module: buf.build/serverlessinbox/mailbox-idl-user-api
    - file_option: go_package
      path: jobs.proto
      value: github.com/serverlessinbox/mailbox-idl/user-api/userapi;userapiv1
      module: buf.build/serverlessinbox/mailbox-idl-user-api
    - file_option: go_package
      path: common.proto
      value: github.com/serverlessinbox/mailbox-idl/user-api/userapi/common;commonv1
      module: buf.build/serverlessinbox/mailbox-idl-user-api
plugins:
  - remote: buf.build/bufbuild/es:v2.15.0
    out: .
    include_imports: true
    opt:
      - target=ts

  - local: ["../tools/protoc-gen-ts-client/protoc-gen-ts-client"]
    out: .
    strategy: all
    opt:
      - paths=source_relative
