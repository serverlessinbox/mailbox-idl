# buf.gen.go.yaml - Go SDK generation (from protobuf)
version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=shared

  - local: protoc-gen-validate
    out: .
    opt:
      - lang=go
      - module=shared

  - local: ["tools/protoc-gen-go-interface/protoc-gen-go-interface"]
    out: .
    opt:
      - module=shared
