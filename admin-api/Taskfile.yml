version: '3'

tasks:
  generate:go:
    desc: Generate Go server SDK from protobuf (output outside this repo)
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      GO_PACKAGE_PREFIX: '{{.GO_PACKAGE_PREFIX}}'
      GO_MODULE_TRIM: '{{.GO_MODULE_TRIM}}'
      TOOLSBIN: '{{.TASKFILE_DIR}}/tools/bin'
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.OUTPUT_DIR}}" ]; then
          echo "ERROR: OUTPUT_DIR is required (directory to write generated Go files to)." >&2
          exit 2
        fi
        if [ -z "{{.GO_PACKAGE_PREFIX}}" ]; then
          echo "ERROR: GO_PACKAGE_PREFIX is required (Go import path prefix, e.g. example.com/myapp/generated)." >&2
          exit 2
        fi
        if [ -z "{{.GO_MODULE_TRIM}}" ]; then
          echo "ERROR: GO_MODULE_TRIM is required (protoc-gen-go module= value, e.g. example.com/myapp)." >&2
          exit 2
        fi
        # Ensure tools/bin directory exists
        mkdir -p {{.TOOLSBIN}}

        # Install protoc-gen-go to local tools/bin (pinned to version matching google.golang.org/protobuf)
        GOBIN={{.TOOLSBIN}} go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

        # Install protoc-gen-validate to local tools/bin
        GOBIN={{.TOOLSBIN}} go install github.com/envoyproxy/protoc-gen-validate@v1.0.4

        # Build the local buf plugin for the host platform — the checked-out binary
        # may be from another OS/arch (buf execs it by relative path).
        (cd tools/protoc-gen-go-interface && GOWORK=off go build -o protoc-gen-go-interface .)

        # Render the template with variables
        TMP_DIR=$(mktemp -d)
        trap "rm -rf $TMP_DIR" EXIT
        TMP_YAML="$TMP_DIR/buf.gen.yaml"
        cat buf.gen.go.yaml.tmpl | \
          sed -e 's|@GO_PACKAGE_PREFIX@|{{.GO_PACKAGE_PREFIX}}|g' \
              -e 's|@GO_MODULE_TRIM@|{{.GO_MODULE_TRIM}}|g' \
          > "$TMP_YAML"

        # Verify all template variables were replaced
        if grep -qE '@[A-Z_]+@' "$TMP_YAML"; then
          echo "ERROR: Template has unsubstituted variables (check buf.gen.go.yaml.tmpl):" >&2
          grep -nE '@[A-Z_]+@' "$TMP_YAML" >&2
          exit 2
        fi

        buf generate --template "$TMP_YAML" -o "{{.OUTPUT_DIR}}"
    sources:
      - proto/**/*.proto
      - buf.yaml
      - buf.lock
      - buf.gen.go.yaml.tmpl
      - tools/protoc-gen-go-interface/**

  generate:go:http-client:
    desc: Generate Go HTTP client SDK (output outside this repo)
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      GO_PACKAGE_PREFIX: '{{.GO_PACKAGE_PREFIX}}'
      GO_MODULE_TRIM: '{{.GO_MODULE_TRIM}}'
      CLIENT_PACKAGE: '{{.CLIENT_PACKAGE | default "adminclient"}}'
      CLIENT_FILENAME: '{{.CLIENT_FILENAME | default "generated/adminclient/admin_api_http_client.pb.go"}}'
      COMPOUND_CLIENT: '{{.COMPOUND_CLIENT | default "false"}}'
      COMPOUND_CLIENT_FILENAME: '{{.COMPOUND_CLIENT_FILENAME | default "generated/adminclient/admin_api_client.pb.go"}}'
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.OUTPUT_DIR}}" ]; then
          echo "ERROR: OUTPUT_DIR is required (directory to write generated Go files to)." >&2
          exit 2
        fi
        if [ -z "{{.GO_PACKAGE_PREFIX}}" ]; then
          echo "ERROR: GO_PACKAGE_PREFIX is required (Go import path prefix, e.g. example.com/myapp/generated)." >&2
          exit 2
        fi
        if [ -z "{{.GO_MODULE_TRIM}}" ]; then
          echo "ERROR: GO_MODULE_TRIM is required (protoc-gen-go module= value, e.g. example.com/myapp)." >&2
          exit 2
        fi

        # Ensure local protoc plugin exists for this platform.
        (cd tools/protoc-gen-go-http-client && GOWORK=off go build -o protoc-gen-go-http-client .)

        # Render the template with variables
        TMP_DIR=$(mktemp -d)
        trap "rm -rf $TMP_DIR" EXIT
        TMP_YAML="$TMP_DIR/buf.gen.yaml"
        cat buf.gen.go.httpclient.yaml.tmpl | \
          sed -e 's|@GO_PACKAGE_PREFIX@|{{.GO_PACKAGE_PREFIX}}|g' \
              -e 's|@GO_MODULE_TRIM@|{{.GO_MODULE_TRIM}}|g' \
              -e 's|@CLIENT_PACKAGE@|{{.CLIENT_PACKAGE}}|g' \
              -e 's|@CLIENT_FILENAME@|{{.CLIENT_FILENAME}}|g' \
              -e 's|@COMPOUND_CLIENT@|{{.COMPOUND_CLIENT}}|g' \
              -e 's|@COMPOUND_CLIENT_FILENAME@|{{.COMPOUND_CLIENT_FILENAME}}|g' \
          > "$TMP_YAML"

        # Verify all template variables were replaced
        if grep -qE '@[A-Z_]+@' "$TMP_YAML"; then
          echo "ERROR: Template has unsubstituted variables (check buf.gen.go.httpclient.yaml.tmpl):" >&2
          grep -nE '@[A-Z_]+@' "$TMP_YAML" >&2
          exit 2
        fi

        buf generate --template "$TMP_YAML" -o "{{.OUTPUT_DIR}}"
    sources:
      - proto/**/*.proto
      - buf.yaml
      - buf.lock
      - buf.gen.go.httpclient.yaml.tmpl
      - tools/protoc-gen-go-http-client/**


  generate:ts:
    desc: Generate TypeScript SDK from protobuf (output outside this repo; OUTPUT_DIR required; HANDLER_CONTEXT_MODULE enables the *_service.ts files; PROTO_PATH limits generation to one proto file)
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      HANDLER_CONTEXT_MODULE: '{{.HANDLER_CONTEXT_MODULE}}'
      PROTO_PATH: '{{.PROTO_PATH}}'
    cmds:
      - |
        set -euo pipefail
        if [ -z "{{.OUTPUT_DIR}}" ]; then
          echo "ERROR: OUTPUT_DIR is required (directory to write generated TS files to)." >&2
          exit 2
        fi
        # Build the local buf plugin for the host platform — the checked-out binary
        # may be from another OS/arch (buf execs it by relative path).
        (cd tools/protoc-gen-ts-client && GOWORK=off go build -o protoc-gen-ts-client .)

        # The local plugin's option list ends the template; the module option is added after paths=.
        TMP_DIR=$(mktemp -d)
        trap "rm -rf $TMP_DIR" EXIT
        TMP_YAML="$TMP_DIR/buf.gen.yaml"
        if [ -n "{{.HANDLER_CONTEXT_MODULE}}" ]; then
          awk -v module="{{.HANDLER_CONTEXT_MODULE}}" '{ print } /^      - paths=source_relative$/ { print "      - handler_context_module=" module }' buf.gen.ts.yaml > "$TMP_YAML"
          if ! grep -q '^      - handler_context_module=' "$TMP_YAML"; then
            echo "ERROR: buf.gen.ts.yaml has no paths=source_relative option line to add handler_context_module after." >&2
            exit 2
          fi
        else
          cp buf.gen.ts.yaml "$TMP_YAML"
        fi

        PATH_ARGS=()
        if [ -n "{{.PROTO_PATH}}" ]; then
          PATH_ARGS=(--path "{{.PROTO_PATH}}")
        fi
        buf generate --template "$TMP_YAML" -o "{{.OUTPUT_DIR}}" "${PATH_ARGS[@]+"${PATH_ARGS[@]}"}"
    method: none

  lint:
    desc: Lint protobuf definitions
    cmds:
      - buf lint

  breaking:
    desc: Run breaking change checks (against local baseline)
    cmds:
      - buf breaking --against '.git#branch=main'
