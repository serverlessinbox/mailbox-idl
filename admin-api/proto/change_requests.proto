syntax = "proto3";

package ops.v1;

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "admin-api/generated/ops;opsv1";

// ============================================
// Change Requests (Long-running / Human-in-loop)
// ============================================
//
// Purpose
// -------
// Track operational requests that may take minutes to days and may involve
// provider workflows (e.g. Service Quotas, Support cases).
//
// Key properties
// --------------
// - Durable request object (current status)
// - Append-only event history (audit + UX timeline)
// - Server-side de-duplication: prevent multiple open requests of same type
//
// Notes
// -----
// - Scope is currently implicit (derived from auth/account context).

enum ChangeRequestType {
  CHANGE_REQUEST_TYPE_UNSPECIFIED = 0;
  // Increase the SES daily sending quota (max emails in 24h).
  CHANGE_REQUEST_TYPE_SES_MAX_24H_SEND_INCREASE = 1;

  // Increase the Lambda account-level concurrency quota.
  CHANGE_REQUEST_TYPE_LAMBDA_CONCURRENCY_INCREASE = 2;

  // Increase the SES sending rate quota (emails/second).
  CHANGE_REQUEST_TYPE_SES_MAX_SEND_RATE_INCREASE = 3;
}

enum ChangeRequestStatus {
  CHANGE_REQUEST_STATUS_UNSPECIFIED = 0;

  // Accepted and stored, but not yet submitted to provider.
  CHANGE_REQUEST_STATUS_ACCEPTED = 1;

  // Submitted to provider (or provider workflow initiated).
  CHANGE_REQUEST_STATUS_SUBMITTED = 2;

  // Provider indicates progress.
  CHANGE_REQUEST_STATUS_IN_PROGRESS = 3;

  // A provider workflow exists and is waiting (e.g. AWS opened a support case).
  CHANGE_REQUEST_STATUS_WAITING_ON_PROVIDER = 4;

  // Cannot proceed without user input in this UI.
  CHANGE_REQUEST_STATUS_ACTION_REQUIRED = 5;

  // Final states
  CHANGE_REQUEST_STATUS_SUCCEEDED = 6;
  CHANGE_REQUEST_STATUS_REJECTED = 7;
  CHANGE_REQUEST_STATUS_FAILED = 8;
  CHANGE_REQUEST_STATUS_CANCELED = 9;
}

enum ConflictBehavior {
  CONFLICT_BEHAVIOR_UNSPECIFIED = 0;

  // Default: return the existing open request (idempotent UX).
  CONFLICT_BEHAVIOR_RETURN_EXISTING_OPEN = 1;

  // Fail when an open request exists.
  CONFLICT_BEHAVIOR_FAIL_IF_OPEN = 2;

  // Allow multiple open requests (rarely desired).
  CONFLICT_BEHAVIOR_ALLOW_DUPLICATE = 3;
}

message AwsQuotaRequestReference {
  // AWS region used for the quota request (e.g. "us-east-1").
  string region = 1 [(validate.rules).string = {min_len: 1, max_len: 32}];

  // AWS Service Quotas identifiers for the quota.
  // Examples: service_code="ses", quota_code="L-05D7B1F0" (codes vary).
  string service_code = 2 [(validate.rules).string = {min_len: 1, max_len: 64}];
  string quota_code = 3 [(validate.rules).string = {min_len: 1, max_len: 128}];

  // Human-friendly display strings for UI.
  string quota_name = 4 [(validate.rules).string = {min_len: 1, max_len: 256}];
  optional string quota_description = 5 [(validate.rules).string = {max_len: 2048}];

  // AWS provider identifiers; set when known.
  optional string service_quotas_request_id = 6 [(validate.rules).string = {max_len: 128}];

  // Optional AWS Console deep link.
  optional string console_url = 7 [(validate.rules).string = {max_len: 2048}];

  // Optional requested value (for display). Units depend on quota.
  optional double requested_value = 8;
}

message SesSendingLimitIncreasePayload {
  // Free-form explanation of use case, volume expectations, and safety controls.
  string use_case = 1 [(validate.rules).string = {min_len: 1, max_len: 2048}];

  // Optional desired sending limits.
  optional double desired_max_24h_send = 2 [(validate.rules).double = {gte: 0}];
  optional double desired_max_send_rate_per_second = 3 [(validate.rules).double = {gte: 0}];

  // Optional metadata.
  optional string website_url = 4 [(validate.rules).string = {max_len: 2048}];
  optional string contact_email = 5 [(validate.rules).string = {max_len: 320}];
}

message LambdaConcurrencyIncreasePayload {
  // Desired account-level concurrent executions limit.
  int32 desired_account_limit = 1 [(validate.rules).int32 = {gte: 1, lte: 100000}];

  // Free-form justification.
  string reason = 2 [(validate.rules).string = {min_len: 1, max_len: 2048}];

  // Optional contact email.
  optional string contact_email = 3 [(validate.rules).string = {max_len: 320}];
}

message ChangeRequest {
  // request_id: Unique identifier for this change request.
  string request_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
  // type: The kind of quota/capacity increase being requested.
  ChangeRequestType type = 2;
  // status: Current lifecycle status of the request.
  ChangeRequestStatus status = 3;

  // created_at: When the request was first created.
  google.protobuf.Timestamp created_at = 4;
  // updated_at: When the request was last updated.
  optional google.protobuf.Timestamp updated_at = 5;
  // closed_at: When the request reached a terminal status (succeeded/rejected/failed/canceled).
  optional google.protobuf.Timestamp closed_at = 6;

  // aws_reference: AWS Service Quotas reference details (populated when a quota request has been submitted).
  optional AwsQuotaRequestReference aws_reference = 7;

  // summary: Human-readable one-line summary of current state for UI display.
  optional string summary = 8 [(validate.rules).string = {max_len: 512}];
  // last_error: The most recent error message, if status is FAILED.
  optional string last_error = 9 [(validate.rules).string = {max_len: 2048}];

  oneof payload {
    SesSendingLimitIncreasePayload ses_sending_limit = 20;
    LambdaConcurrencyIncreasePayload lambda_concurrency = 21;
  }
}

enum ChangeRequestEventKind {
  CHANGE_REQUEST_EVENT_KIND_UNSPECIFIED = 0;
  CHANGE_REQUEST_EVENT_KIND_CREATED = 1;
  CHANGE_REQUEST_EVENT_KIND_SUBMITTED = 2;
  CHANGE_REQUEST_EVENT_KIND_PROVIDER_UPDATED = 3;
  CHANGE_REQUEST_EVENT_KIND_SUPPORT_CASE_OPENED = 4;
  CHANGE_REQUEST_EVENT_KIND_ACTION_REQUIRED = 5;
  CHANGE_REQUEST_EVENT_KIND_USER_PROVIDED_INFO = 6;
  CHANGE_REQUEST_EVENT_KIND_APPROVED = 7;
  CHANGE_REQUEST_EVENT_KIND_REJECTED = 8;
  CHANGE_REQUEST_EVENT_KIND_SUCCEEDED = 9;
  CHANGE_REQUEST_EVENT_KIND_FAILED = 10;
  CHANGE_REQUEST_EVENT_KIND_CANCELED = 11;
  CHANGE_REQUEST_EVENT_KIND_COMMENT = 12;
}

message ChangeRequestEvent {
  // event_id: Unique identifier for this event.
  string event_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
  // request_id: The change request this event belongs to.
  string request_id = 2 [(validate.rules).string = {min_len: 1, max_len: 128}];
  // at: When this event occurred.
  google.protobuf.Timestamp at = 3;

  // kind: The type of event (created, submitted, action required, etc.).
  ChangeRequestEventKind kind = 4;

  // message: One-line message suitable for timeline rendering in the UI.
  optional string message = 5 [(validate.rules).string = {max_len: 512}];

  // aws_reference: Optional AWS reference when first discovered at this event.
  optional AwsQuotaRequestReference aws_reference = 6;

  reserved 7;

  // Optional structured info for the event.
  // Prefer using these typed messages over opaque JSON.
  oneof details {
    ProviderUpdatedDetails provider_updated = 20;
    SupportCaseOpenedDetails support_case_opened = 21;
    ActionRequiredDetails action_required = 22;
    UserProvidedInfoDetails user_provided_info = 23;
    CommentDetails comment = 24;
  }
}

message ProviderUpdatedDetails {
  // Provider-specific status string (e.g. "PendingReview").
  string provider_status = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
  // Optional provider message or summary.
  optional string note = 2 [(validate.rules).string = {max_len: 2048}];
}

message SupportCaseOpenedDetails {
  // Optional provider URL to the support case or workflow.
  optional string provider_url = 1 [(validate.rules).string = {max_len: 2048}];
}

message ActionRequiredDetails {
  // Keys/fields the UI should collect.
  repeated string required_fields = 1 [(validate.rules).repeated = {max_items: 50}];
  // Human-readable instructions.
  optional string instructions = 2 [(validate.rules).string = {max_len: 2048}];
}

message UserProvidedInfoDetails {
  // Keys/fields the user provided in a follow-up.
  repeated string provided_fields = 1 [(validate.rules).repeated = {max_items: 50}];
  // Whether the user provided contact info (do not store the actual email here).
  optional bool provided_contact_email = 2;
}

message CommentDetails {
  // A comment intended for timeline rendering.
  string text = 1 [(validate.rules).string = {min_len: 1, max_len: 2048}];
}

message CreateChangeRequestRequest {
  // type: The kind of change/quota increase to request.
  ChangeRequestType type = 1;

  // idempotency_key: Optional safe retry key for button-click retries (e.g. a UUID from the UI).
  optional string idempotency_key = 2 [(validate.rules).string = {max_len: 128}];

  // conflict_behavior: What to do when an open request of the same type already exists.
  // Default is RETURN_EXISTING_OPEN (idempotent / safe for UI retries).
  optional ConflictBehavior conflict_behavior = 3;

  oneof payload {
    SesSendingLimitIncreasePayload ses_sending_limit = 10;
    LambdaConcurrencyIncreasePayload lambda_concurrency = 11;
  }
}

message CreateChangeRequestResponse {
  // request: The newly created (or returned existing) change request.
  ChangeRequest request = 1;
  // reused_existing_open: True when an existing open request was returned instead of creating a new one.
  bool reused_existing_open = 2;
}

message GetChangeRequestRequest {
  // request_id: The change request to retrieve.
  string request_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
}

message GetChangeRequestResponse {
  // request: The requested change request.
  ChangeRequest request = 1;
}

message ListChangeRequestsRequest {
  // page_size: Maximum number of results per page (default: 20, max: 200). Results are newest-first.
  optional int32 page_size = 1 [(validate.rules).int32 = {gte: 1, lte: 200}];
  // page_token: Token from previous response to retrieve the next page.
  optional string page_token = 2 [(validate.rules).string = {max_len: 512}];
  // type: Filter to a specific request type. Omit to return all types.
  optional ChangeRequestType type = 3;
  // status: Filter to specific statuses. Omit to return all statuses.
  repeated ChangeRequestStatus status = 4;
}

message ListChangeRequestsResponse {
  // requests: Change requests for this page, newest-first.
  repeated ChangeRequest requests = 1;
  // next_page_token: Token for the next page. Empty when no more results.
  optional string next_page_token = 2 [(validate.rules).string = {max_len: 512}];
}

message ListChangeRequestEventsRequest {
  // request_id: The change request whose event history to retrieve.
  string request_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
  // page_size: Maximum number of events per page (default: 50, max: 500).
  optional int32 page_size = 2 [(validate.rules).int32 = {gte: 1, lte: 500}];
  // page_token: Token from previous response to retrieve the next page.
  optional string page_token = 3 [(validate.rules).string = {max_len: 512}];
}

message ListChangeRequestEventsResponse {
  // events: Events for this page, oldest-first.
  repeated ChangeRequestEvent events = 1;
  // next_page_token: Token for the next page. Empty when no more results.
  optional string next_page_token = 2 [(validate.rules).string = {max_len: 512}];
}

message ProvideChangeRequestInfoRequest {
  // request_id: The change request to provide follow-up information for.
  string request_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];

  reserved 2;

  // Strongly-typed follow-up info. Use this when a request is in ACTION_REQUIRED.
  oneof info {
    SesSendingLimitIncreaseInfo ses_sending_limit = 10;
    LambdaConcurrencyIncreaseInfo lambda_concurrency = 11;
    ProvideChangeRequestComment comment = 12;
  }
}

message SesSendingLimitIncreaseInfo {
  // Optional additional details.
  optional string use_case = 1 [(validate.rules).string = {max_len: 2048}];
  optional double desired_max_24h_send = 2 [(validate.rules).double = {gte: 0}];
  optional double desired_max_send_rate_per_second = 3 [(validate.rules).double = {gte: 0}];
  optional string website_url = 4 [(validate.rules).string = {max_len: 2048}];
  // Optional contact email. Consider treating this as sensitive and excluding it from audit/events.
  optional string contact_email = 5 [(validate.rules).string = {max_len: 320}];
}

message LambdaConcurrencyIncreaseInfo {
  optional int32 desired_account_limit = 1 [(validate.rules).int32 = {gte: 1, lte: 100000}];
  optional string reason = 2 [(validate.rules).string = {max_len: 2048}];
  // Optional contact email. Consider treating this as sensitive and excluding it from audit/events.
  optional string contact_email = 3 [(validate.rules).string = {max_len: 320}];
}

message ProvideChangeRequestComment {
  string text = 1 [(validate.rules).string = {min_len: 1, max_len: 2048}];
}

message ProvideChangeRequestInfoResponse {
  // request: The updated change request after the info was provided.
  ChangeRequest request = 1;
}

message CancelChangeRequestRequest {
  // request_id: The change request to cancel.
  string request_id = 1 [(validate.rules).string = {min_len: 1, max_len: 128}];
  // reason: Optional cancellation reason for the audit trail.
  optional string reason = 2 [(validate.rules).string = {max_len: 512}];
}

message CancelChangeRequestResponse {
  // request: The updated change request with CANCELED status.
  ChangeRequest request = 1;
}

// ChangeRequestsService manages long-running operational requests such as quota increases.
// Requests may take minutes to days to complete and may involve external provider workflows.
service ChangeRequestsService {
  // CreateChangeRequest creates a new change request (or returns an existing open one).
  rpc CreateChangeRequest(CreateChangeRequestRequest) returns (CreateChangeRequestResponse);
  // GetChangeRequest retrieves a specific change request by ID.
  rpc GetChangeRequest(GetChangeRequestRequest) returns (GetChangeRequestResponse);
  // ListChangeRequests lists all change requests for the tenant, newest-first.
  rpc ListChangeRequests(ListChangeRequestsRequest) returns (ListChangeRequestsResponse);
  // ListChangeRequestEvents returns the append-only event history for a specific request.
  rpc ListChangeRequestEvents(ListChangeRequestEventsRequest) returns (ListChangeRequestEventsResponse);

  // ProvideChangeRequestInfo submits follow-up information for a request in ACTION_REQUIRED status.
  rpc ProvideChangeRequestInfo(ProvideChangeRequestInfoRequest) returns (ProvideChangeRequestInfoResponse);
  // CancelChangeRequest cancels an open request.
  rpc CancelChangeRequest(CancelChangeRequestRequest) returns (CancelChangeRequestResponse);
}
