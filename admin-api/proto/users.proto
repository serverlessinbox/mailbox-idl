syntax = "proto3";

package users.v1;

import "aliases.proto";
import "common.proto";
import "validate/validate.proto";

// UsersService provides operations for managing users and their primary accounts.
service UsersService {
  // ListUsers retrieves all users with pagination.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // GetUser retrieves a specific user together with their primary account context.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // UpdateUser updates user properties. Optionally renames the user's primary account.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // DeleteUser soft-deletes a user. Set purge_data=true to also destroy the primary account and all mailbox data.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // AddUserAccountCapability idempotently adds a new JMAP capability to the user's primary account and provisions the required resources.
  rpc AddUserAccountCapability(AddUserAccountCapabilityRequest) returns (AddUserAccountCapabilityResponse);
}

message User {
  // user_id: Unique user identifier (usr_ prefix).
  string user_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^usr_[a-zA-Z0-9_-]{21}$"
  }];
  // name: Canonical username (typically the email local-part or IDP username).
  string name = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
  // display_name: Optional human-readable display name shown in the UI.
  string display_name = 3 [(validate.rules).string.max_len = 100];
  // primary_email: The user's primary email address (from their primary account alias).
  optional string primary_email = 4 [(validate.rules).string = {
    email: true
    max_len: 255
  }];
  // primary_account_id: The ID of the user's primary JMAP account (acc_ prefix).
  optional string primary_account_id = 5 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
  // is_active: When false, the user cannot authenticate or access the system.
  bool is_active = 6;
  // is_admin: When true, the user has administrative privileges in the admin UI.
  bool is_admin = 7;
  // is_deleted: When true, the user has been soft-deleted and should be treated as non-existent.
  bool is_deleted = 8;

  // idp_identities: Persisted IDP identity information (best-effort, may be stale).
  repeated IdpIdentity idp_identities = 9;
}

message IdpIdentity {
  // IDP provider identifier (e.g. "cognito", "auth0", "google", "oidc").
  string provider = 1 [(validate.rules).string = {min_len: 1, max_len: 50}];

  // OIDC subject ("sub") claim value.
  string sub = 2 [(validate.rules).string = {min_len: 1, max_len: 255}];

  // Human-friendly username derived from claims.
  string username = 3 [(validate.rules).string = {min_len: 1, max_len: 255}];

  // Optional email claim value.
  optional string email = 4 [(validate.rules).string = {email: true, max_len: 255}];

  // Groups/roles claim values.
  repeated string groups = 5 [(validate.rules).repeated = {min_items: 0, max_items: 100}];
}

message ListUsersRequest {
  // page_size: Maximum number of users to return per page (default: 50, max: 1000).
  optional int32 page_size = 1 [(validate.rules).int32 = {gte: 1, lte: 1000}];
  // page_token: Token from previous response to retrieve the next page.
  optional string page_token = 2 [(validate.rules).string.max_len = 512];
}

message ListUsersResponse {
  // users: The list of users for this page.
  repeated User users = 1;
  // next_page_token: Token to pass to the next ListUsersRequest. Empty when no more results.
  string next_page_token = 2;
}

message GetUserRequest {
  // user_id: The user to retrieve (usr_ prefix).
  string user_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^usr_[a-zA-Z0-9_-]{21}$"
  }];
}

message GetUserResponse {
  // user: The requested user.
  User user = 1;

  // primary_account: Present when the user has a primary_account_id.
  optional common.v1.Account primary_account = 2;

  // primary_account_aliases: Aliases for the primary account (admin view includes invisible/system aliases).
  repeated aliases.v1.Alias primary_account_aliases = 3;
}

message UpdateUserRequest {
  // user_id: The user to update (usr_ prefix).
  string user_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^usr_[a-zA-Z0-9_-]{21}$"
  }];
  // display_name: New display name for the user. Omit to leave unchanged.
  optional string display_name = 2 [(validate.rules).string.max_len = 100];
  // is_active: Set to false to suspend the user's access.
  optional bool is_active = 4;
  // is_admin: Set to true to grant or revoke administrative privileges.
  optional bool is_admin = 5;
  // account_name: When set, renames the user's primary account.
  optional string account_name = 6 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
}

message UpdateUserResponse {
  // user: The updated user.
  User user = 1;
}

message DeleteUserRequest {
  // user_id: The user to delete (usr_ prefix).
  string user_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^usr_[a-zA-Z0-9_-]{21}$"
  }];
  // purge_data: When true, also deletes the user's primary account and all mailbox data.
  // Use with caution — this is irreversible.
  bool purge_data = 2;
}

message DeleteUserResponse {}

message AddUserAccountCapabilityRequest {
  string user_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^usr_[a-zA-Z0-9_-]{21}$"
  }];
  // capability: The JMAP capability to add. See common.v1.AccountCapability for valid values.
  common.v1.AccountCapability capability = 2 [(validate.rules).enum.defined_only = true];
}

message AddUserAccountCapabilityResponse {
  // user: The updated user with the new capability reflected in their primary account.
  User user = 1;
}
