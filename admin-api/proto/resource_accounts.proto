syntax = "proto3";

package resource_accounts.v1;

import "common.proto";
import "validate/validate.proto";

// ResourceAccountsService manages resource account principals and their delegates.
// A resource account is a resource mailbox (mailbox, room, or equipment) that can be
// accessed by multiple users via delegation.
service ResourceAccountsService {
  // CreateResourceAccount provisions a new resource account with the given identity.
  rpc CreateResourceAccount(CreateResourceAccountRequest) returns (CreateResourceAccountResponse);

  // GetResourceAccount retrieves a resource account by ID.
  rpc GetResourceAccount(GetResourceAccountRequest) returns (GetResourceAccountResponse);

  // ListResourceAccounts lists all resource accounts for the tenant.
  rpc ListResourceAccounts(ListResourceAccountsRequest) returns (ListResourceAccountsResponse);

  // UpdateResourceAccount updates resource account properties.
  rpc UpdateResourceAccount(UpdateResourceAccountRequest) returns (UpdateResourceAccountResponse);

  // DeleteResourceAccount removes the resource account and its account.
  rpc DeleteResourceAccount(DeleteResourceAccountRequest) returns (DeleteResourceAccountResponse);

  // AddDelegate grants a principal delegate access to a resource account.
  rpc AddDelegate(AddDelegateRequest) returns (AddDelegateResponse);

  // RemoveDelegate revokes delegate access from a principal.
  rpc RemoveDelegate(RemoveDelegateRequest) returns (RemoveDelegateResponse);

  // ListDelegates lists all delegates for a resource account.
  rpc ListDelegates(ListDelegatesRequest) returns (ListDelegatesResponse);

  // AddResourceAccountCapability idempotently adds a new JMAP capability to a resource account and provisions the required resources.
  rpc AddResourceAccountCapability(AddResourceAccountCapabilityRequest) returns (AddResourceAccountCapabilityResponse);
}

// ============================================
// Enums
// ============================================

// ResourceClass categorizes the type of resource account.
enum ResourceClass {
  RESOURCE_CLASS_UNSPECIFIED = 0;
  RESOURCE_CLASS_SHARED = 1;    // Standard shared mailbox
  RESOURCE_CLASS_ROOM = 2;       // Meeting room resource
  RESOURCE_CLASS_EQUIPMENT = 3;  // Equipment resource
}

// DelegateAccessLevel defines the level of access granted to a delegate.
enum DelegateAccessLevel {
  DELEGATE_ACCESS_LEVEL_UNSPECIFIED = 0;
  DELEGATE_ACCESS_LEVEL_READ_ONLY = 1;   // Read-only access to mailbox contents
  DELEGATE_ACCESS_LEVEL_READ_WRITE = 2;  // Full read/write access to mailbox contents
}

// ============================================
// Messages (Data Types)
// ============================================

// ResourceAccount represents a resource account.
message ResourceAccount {
  // id: Unique resource account identifier (res_ prefix).
  string id = 1;
  // name: Internal name for the resource account (used in system references).
  string name = 2;
  // display_name: Human-readable display name shown to users.
  string display_name = 3;
  // email: Primary email address for this resource account.
  string email = 4;
  // resource_class: Type of resource this account represents.
  ResourceClass resource_class = 5;
  // account_id: The JMAP account provisioned for this resource account (acc_ prefix).
  string account_id = 6;
  // status: Current provisioning/lifecycle status (e.g. "active", "provisioning", "suspended").
  string status = 7;
  // capabilities: List of enabled JMAP capabilities for this account.
  repeated string capabilities = 8;
}

// Delegate represents a principal's access grant to a shared mailbox account.
message Delegate {
  // principal_id: The principal (usr_ or grp_ prefix) granted access.
  string principal_id = 1;
  // principal_type: Type of the principal ("user" or "group").
  string principal_type = 2;
  // display_name: Display name of the principal.
  string display_name = 3;
  // access_level: The level of access granted.
  DelegateAccessLevel access_level = 4;
}

// ============================================
// Request/Response messages
// ============================================

message CreateResourceAccountRequest {
  // name: Internal name for the resource account.
  string name = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 255
  }];
  // display_name: Human-readable display name.
  string display_name = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 255
  }];
  // local_part: Email local part for the primary address (e.g. "boardroom" for boardroom@example.com).
  string local_part = 3 [(validate.rules).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+$"
  }];
  // domain_id: Domain for the primary email address (dom_ prefix).
  string domain_id = 4 [(validate.rules).string = {
    min_len: 1
    pattern: "^dom_[a-zA-Z0-9_-]{21}$"
  }];
  // resource_class: Type of resource this account represents.
  ResourceClass resource_class = 5;
}

message CreateResourceAccountResponse {
  ResourceAccount resource_account = 1;
}

message GetResourceAccountRequest {
  // id: The resource account ID to retrieve (res_ prefix).
  string id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^res_[a-zA-Z0-9_-]{21}$"
  }];
}

message GetResourceAccountResponse {
  ResourceAccount resource_account = 1;
}

message ListResourceAccountsRequest {}

message ListResourceAccountsResponse {
  repeated ResourceAccount resource_accounts = 1;
}

message UpdateResourceAccountRequest {
  // id: The resource account to update (res_ prefix).
  string id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^res_[a-zA-Z0-9_-]{21}$"
  }];
  // display_name: New display name for the resource account.
  optional string display_name = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 255
  }];
}

message UpdateResourceAccountResponse {
  ResourceAccount resource_account = 1;
}

message DeleteResourceAccountRequest {
  // id: The resource account to delete (res_ prefix).
  string id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^res_[a-zA-Z0-9_-]{21}$"
  }];
}

message DeleteResourceAccountResponse {}

message AddDelegateRequest {
  // account_id: The resource account to grant access to (acc_ prefix).
  string account_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
  // principal_id: The principal to grant delegate access to (usr_ or grp_ prefix).
  string principal_id = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 64
  }];
  // access_level: The level of access to grant.
  DelegateAccessLevel access_level = 3;
}

message AddDelegateResponse {
  Delegate delegate = 1;
}

message RemoveDelegateRequest {
  // account_id: The resource account to revoke access from (acc_ prefix).
  string account_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
  // principal_id: The principal to revoke delegate access from.
  string principal_id = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 64
  }];
}

message RemoveDelegateResponse {}

message ListDelegatesRequest {
  // account_id: The resource account to list delegates for (acc_ prefix).
  string account_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
}

message ListDelegatesResponse {
  repeated Delegate delegates = 1;
}

message AddResourceAccountCapabilityRequest {
  // id: The resource account ID (res_ prefix).
  string id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^res_[a-zA-Z0-9_-]{21}$"
  }];
  // capability: The JMAP capability to add. See common.v1.AccountCapability for valid values.
  common.v1.AccountCapability capability = 2 [(validate.rules).enum.defined_only = true];
}

message AddResourceAccountCapabilityResponse {
  // resource_account: The updated resource account with the new capability reflected in its account.
  ResourceAccount resource_account = 1;
}
