syntax = "proto3";

package suppression.v1;

import "common.proto";
import "validate/validate.proto";
import "google/protobuf/timestamp.proto";

// SuppressionService provides operations for managing recipient suppressions
service SuppressionService {
  // GetSuppression retrieves suppression details for a specific recipient
  rpc GetSuppression(GetSuppressionRequest) returns (GetSuppressionResponse);
  
  // ListSuppressions lists all suppressions with pagination
  rpc ListSuppressions(ListSuppressionsRequest) returns (ListSuppressionsResponse);

  // ClearBounceSuppression clears bounce suppression (sets level to NONE) while preserving counters/history.
  rpc ClearBounceSuppression(ClearBounceSuppressionRequest) returns (ClearBounceSuppressionResponse);

  // ClearComplaintSuppression clears complaint suppression for a specific message class (sets level to NONE)
  // while preserving counters/history.
  rpc ClearComplaintSuppression(ClearComplaintSuppressionRequest) returns (ClearComplaintSuppressionResponse);
}

// BounceLevel represents the severity of bounce events
enum BounceLevel {
  BOUNCE_LEVEL_UNSPECIFIED = 0;
  BOUNCE_LEVEL_NONE = 1;
  BOUNCE_LEVEL_SOFT = 2;
  BOUNCE_LEVEL_HARD = 3;
}

// ComplaintLevel represents the severity of complaint events
enum ComplaintLevel {
  COMPLAINT_LEVEL_UNSPECIFIED = 0;
  COMPLAINT_LEVEL_NONE = 1;
  COMPLAINT_LEVEL_PERMANENT = 2;
}

// BounceInfo tracks bounce statistics for a recipient
message BounceInfo {
  // level: Current bounce suppression level for this recipient.
  BounceLevel level = 1;
  // count: Total number of hard bounce events recorded.
  int32 count = 2;
  // first_occurrence: Timestamp of the first bounce event.
  optional google.protobuf.Timestamp first_occurrence = 3;
  // last_occurrence: Timestamp of the most recent bounce event.
  optional google.protobuf.Timestamp last_occurrence = 4;

  // soft_bounce_count: Number of soft bounces within the current tracking window.
  int32 soft_bounce_count = 5;
  // soft_bounce_window_start: Start of the current soft-bounce counting window.
  optional google.protobuf.Timestamp soft_bounce_window_start = 6;
  // last_bounce_type: SES diagnostic type ("Permanent", "Transient", or "Undetermined").
  string last_bounce_type = 7;
  // last_bounce_sub_type: SES diagnostic sub-type (e.g. "General", "NoEmail", "Suppressed").
  string last_bounce_sub_type = 8;
  // last_diagnostic_code: SMTP diagnostic status code from the last bounce.
  string last_diagnostic_code = 9;
  // reenable_after: If set, bounce suppression should not be auto-cleared before this time.
  optional google.protobuf.Timestamp reenable_after = 10;
}

// ComplaintInfo tracks complaint statistics for a specific message class
message ComplaintInfo {
  // level: Current complaint suppression level for this message class.
  ComplaintLevel level = 1;
  // count: Total number of complaint events recorded for this message class.
  int32 count = 2;
  // first_occurrence: Timestamp of the first complaint event.
  optional google.protobuf.Timestamp first_occurrence = 3;
  // last_occurrence: Timestamp of the most recent complaint event.
  optional google.protobuf.Timestamp last_occurrence = 4;

  // last_complaint_type: SES FeedbackType string from the most recent complaint (e.g. "abuse", "fraud").
  string last_complaint_type = 5;
  // last_identity_id: The sender identity (e.g. SES verified identity ID) that triggered the last complaint.
  string last_identity_id = 6;
  // reenable_after: If set, complaint suppression should not be auto-cleared before this time.
  optional google.protobuf.Timestamp reenable_after = 7;
}

// Complaints tracks complaint statistics per message class
message Complaints {
  ComplaintInfo transactional = 1;
  ComplaintInfo mailing_list = 2;
  ComplaintInfo bulk = 3;
}

// Suppression represents a recipient suppression record
message Suppression {
  // recipient: The email address for which suppression is tracked.
  string recipient = 1 [(validate.rules).string.email = true];
  // bounce: Bounce suppression details for this recipient.
  BounceInfo bounce = 2;
  // complaints: Complaint suppression details broken down by message class.
  Complaints complaints = 3;
}

// GetSuppressionRequest requests suppression details for a recipient
message GetSuppressionRequest {
  string recipient = 1 [(validate.rules).string.email = true];
}

// GetSuppressionResponse returns suppression details
message GetSuppressionResponse {
  Suppression suppression = 1;
}

// ListSuppressionsRequest requests a paginated list of suppressions
message ListSuppressionsRequest {
  optional int32 page_size = 1 [(validate.rules).int32 = {gte: 1, lte: 100}];
  optional string page_token = 2 [(validate.rules).string.max_len = 512];
}

// ListSuppressionsResponse returns a list of suppressions
message ListSuppressionsResponse {
  repeated Suppression suppressions = 1;
  string next_page_token = 2;
}

message ClearBounceSuppressionRequest {
  string recipient = 1 [(validate.rules).string.email = true];
}

message ClearBounceSuppressionResponse {
  Suppression suppression = 1;
}

message ClearComplaintSuppressionRequest {
  string recipient = 1 [(validate.rules).string.email = true];
  common.v1.MessageClass message_class = 2 [(validate.rules).enum.defined_only = true];
}

message ClearComplaintSuppressionResponse {
  Suppression suppression = 1;
}
