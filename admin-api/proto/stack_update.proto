syntax = "proto3";

// Intentional: this file is named stack_update.proto but declares package update.v1,
// unlike every other file in this directory where filename and package match. Not a bug.
package update.v1;

import "validate/validate.proto";

// StackUpdateService handles CloudFormation ChangeSet creation, review, and execution
// for root stack updates. All operations are human-gated and audited.
service StackUpdateService {
  // GetUpdateOptions returns the current stack template version and available upgrade paths
  // within the current distTag, plus any active (pending) changeset.
  rpc GetUpdateOptions(GetUpdateOptionsRequest) returns (GetUpdateOptionsResponse);

  // CreateChangeSet initiates a new changeset for the selected target version,
  // superseding any prior pending changeset. Non-idempotent.
  rpc CreateChangeSet(CreateChangeSetRequest) returns (CreateChangeSetResponse);

  // DescribeChangeSet retrieves the changeset status and resource-level detail.
  // Serves both as a creation-status poll endpoint and a detail-fetch endpoint.
  rpc DescribeChangeSet(DescribeChangeSetRequest) returns (DescribeChangeSetResponse);

  // GetUpdateParameters returns the CloudFormation parameters of the target template version:
  // each with its constraints, the value the stack holds today and the value the server
  // proposes, plus the stack parameters the target template no longer declares.
  // Read-only.
  rpc GetUpdateParameters(GetUpdateParametersRequest) returns (GetUpdateParametersResponse);
}

// ============================================
// GetUpdateOptions
// ============================================

message GetUpdateOptionsRequest {}

message GetUpdateOptionsResponse {
  // Current template version deployed in the stack.
  string current_version = 1;

  // Current distTag (e.g., "stable", "edge").
  string current_dist_tag = 2;

  // Next available minor version bump within the current major version and distTag.
  // Absent if already on the latest minor.
  optional UpdateOption next_minor = 3;

  // Next available major version bump within the current distTag.
  // Absence means no newer major version exists. Presence always implies breaking change.
  optional UpdateOption next_major = 4;

  // Active (pending, not yet executed) changeset if one exists and is still valid.
  // Absent if no changeset is currently pending.
  optional ActiveChangeSet active_change_set = 5;

  // Root stack name (from the stack ARN). Always present. Generic identity field —
  // the client derives console links from stack_name + region.
  string stack_name = 6;

  // AWS region the root stack lives in (from the stack ARN). Always present.
  string region = 7;
}

message UpdateOption {
  // Semantic version string (e.g., "2.1.0").
  string version = 1;
}

message ActiveChangeSet {
  // CloudFormation ChangeSet ID.
  string change_set_id = 1;

  // Template version this changeset was created against (parsed from Description).
  string source_template_version = 2;

  // RFC3339 timestamp of changeset creation (from CFN CreationTime).
  string created_at = 3;

  // True if a newer version has been published since this changeset was created.
  // When true, the UI should prompt to recreate the changeset rather than resume review.
  bool is_stale = 4;
}

// ============================================
// CreateChangeSet
// ============================================

message CreateChangeSetRequest {
  // Target template version. If omitted, defaults to next_minor from GetUpdateOptions.
  // To target next_major, explicitly pass next_major.version.
  // Must match semver pattern if provided.
  optional string target_template_version = 1 [(validate.rules).string = {pattern: "^v?\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9]+(\\.[a-zA-Z0-9]+)*)?$"}];

  // Explicit value for every parameter of the target template. The server rejects the request
  // with an invalid-input error (before superseding any pending changeset) when an entry is
  // missing, duplicated or unknown, when a value violates the template constraints, or when
  // use_previous_value is misused. Exactly one entry per parameter of the target template is
  // required.
  repeated ParameterValue parameters = 2;
}

message CreateChangeSetResponse {
  // CloudFormation ChangeSet ID.
  string change_set_id = 1;

  // CloudFormation ChangeSet ARN.
  string change_set_arn = 2;
}

// ============================================
// GetUpdateParameters
// ============================================

message GetUpdateParametersRequest {
  // Target template version. If omitted, defaults to next_minor from GetUpdateOptions.
  // Must be the latest available version for its track; otherwise the server rejects it.
  // Must match semver pattern if provided.
  optional string target_template_version = 1 [(validate.rules).string = {pattern: "^v?\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9]+(\\.[a-zA-Z0-9]+)*)?$"}];
}

message GetUpdateParametersResponse {
  // Target template version the parameters belong to, as bare semver (no "v" prefix).
  string target_template_version = 1;

  // Parameter groups in template order. Parameters the template does not group are listed
  // in a trailing group with an empty id.
  repeated ParameterGroup groups = 2;

  // All parameters of the target template, in template order.
  repeated TemplateParameter parameters = 3;

  // Parameters the stack has today that the target template no longer declares. Submitting one
  // of them in CreateChangeSet is rejected as an unknown key.
  repeated RemovedParameter removed = 4;
}

// ParameterGroup is a labelled set of template parameters.
message ParameterGroup {
  // Group identifier from the template metadata; empty for the trailing group of ungrouped parameters.
  string id = 1;

  // Human-readable group label.
  string label = 2;

  // Keys of the parameters in this group, in display order. Each key matches TemplateParameter.key.
  repeated string parameter_keys = 3;
}

// TemplateParameter describes one parameter of the target template together with the
// server-computed proposal for its value. The constraint fields mirror the template; the
// server enforces them on CreateChangeSet.
message TemplateParameter {
  // CloudFormation parameter key.
  string key = 1;

  // Human-readable label; the key when the template defines none.
  string label = 2;

  // Parameter description from the template.
  string description = 3;

  // CloudFormation parameter type (e.g., "String", "Number").
  string type = 4;

  // AllowedValues from the template. Empty when the template declares none; otherwise a
  // submitted value must be one of them.
  repeated string allowed_values = 5;

  // Default from the template. Absent when the template declares none.
  optional string default_value = 6;

  // True for NoEcho parameters. The server never returns their values, so current_value and
  // proposed_value are absent.
  bool no_echo = 7;

  // AllowedPattern regular expression from the template. Absent when not declared.
  optional string allowed_pattern = 8;

  // MinLength from the template. Absent when not declared.
  optional int64 min_length = 9;

  // MaxLength from the template. Absent when not declared.
  optional int64 max_length = 10;

  // MinValue from the template (Number type). Absent when not declared.
  optional double min_value = 11;

  // MaxValue from the template (Number type). Absent when not declared.
  optional double max_value = 12;

  // Value the stack holds today. Absent when the parameter is NEW or no_echo.
  optional string current_value = 13;

  // Value the server proposes for this parameter. Absent when no_echo or proposed_source is NONE.
  optional string proposed_value = 14;

  // How proposed_value was derived.
  ProposedValueSource proposed_source = 15;

  // How this parameter differs from the stack today.
  ParameterChange change = 16;

  // Constraint the current value violates under the target template; UNSPECIFIED when none.
  ParameterConstraint violated_constraint = 17;

  // True when the caller must supply a value for this parameter.
  bool required = 18;
}

// RemovedParameter is a parameter on the stack that the target template no longer declares.
message RemovedParameter {
  // CloudFormation parameter key.
  string key = 1;

  // Value the stack holds today. Absent when the value is masked (NoEcho).
  optional string current_value = 2;
}

// ParameterValue is one submitted parameter in CreateChangeSet.
message ParameterValue {
  // CloudFormation parameter key; must be a parameter of the target template.
  string key = 1 [(validate.rules).string = {min_len: 1}];

  // Value to set. Must be empty when use_previous_value is true.
  string value = 2;

  // Keep the value the stack holds today. Only valid for a key the stack already has; the
  // only way to leave a NoEcho parameter unchanged.
  bool use_previous_value = 3;
}

// How the proposed value of a template parameter was derived.
enum ProposedValueSource {
  PROPOSED_VALUE_SOURCE_UNSPECIFIED = 0;
  // The current value is still valid and is proposed unchanged.
  PROPOSED_VALUE_SOURCE_CURRENT = 1;
  // The current value differs only in letter case from an allowed value; the allowed spelling is proposed.
  PROPOSED_VALUE_SOURCE_CASE_MATCHED = 2;
  // The template default is proposed.
  PROPOSED_VALUE_SOURCE_DEFAULT = 3;
  // No usable proposal; proposed_value is absent.
  PROPOSED_VALUE_SOURCE_NONE = 4;
  // NoEcho parameter: the previous value is kept and not disclosed.
  PROPOSED_VALUE_SOURCE_PREVIOUS = 5;
}

// How a template parameter differs from the stack today.
enum ParameterChange {
  PARAMETER_CHANGE_UNSPECIFIED = 0;
  // The parameter exists on the stack and its current value is valid.
  PARAMETER_CHANGE_UNCHANGED = 1;
  // The target template adds this parameter; the stack has no value for it.
  PARAMETER_CHANGE_NEW = 2;
  // The current value is not allowed by the target template; see violated_constraint.
  PARAMETER_CHANGE_VALUE_NOT_ALLOWED = 3;
}

// Template constraint a value violates.
enum ParameterConstraint {
  PARAMETER_CONSTRAINT_UNSPECIFIED = 0;
  PARAMETER_CONSTRAINT_ALLOWED_VALUES = 1;
  PARAMETER_CONSTRAINT_ALLOWED_PATTERN = 2;
  PARAMETER_CONSTRAINT_LENGTH = 3;
  PARAMETER_CONSTRAINT_RANGE = 4;
  // The value is not a valid number for a Number parameter.
  PARAMETER_CONSTRAINT_NUMBER_FORMAT = 5;
}

// ============================================
// DescribeChangeSet
// ============================================

message DescribeChangeSetRequest {
  // CloudFormation ChangeSet ID (from CreateChangeSetResponse or active_change_set).
  string change_set_id = 1 [(validate.rules).string = {min_len: 1}];
}

message DescribeChangeSetResponse {
  // Changeset creation status.
  ChangeSetStatus status = 1;

  // CFN StatusReason on CREATE_FAILED; sanitized for client display.
  string status_reason = 2;

  // Fully-formed AWS Console URL for this changeset.
  string console_url = 3;
}

enum ChangeSetStatus {
  CHANGE_SET_STATUS_UNSPECIFIED = 0;
  CHANGE_SET_STATUS_CREATE_PENDING = 1;
  CHANGE_SET_STATUS_CREATE_IN_PROGRESS = 2;
  CHANGE_SET_STATUS_CREATE_COMPLETE = 3;
  CHANGE_SET_STATUS_CREATE_FAILED = 4;
}

// Mirrors AWS CloudFormation's StackStatus enum 1:1 (one value per CFN
// status string, including DELETE_*, ROLLBACK_* and IMPORT_* families) so a
// future CFN status addition is caught by adding a value here rather than by
// silently collapsing into an existing one.
enum StackStatus {
  STACK_STATUS_UNSPECIFIED = 0;
  STACK_STATUS_CREATE_IN_PROGRESS = 1;
  STACK_STATUS_CREATE_COMPLETE = 2;
  STACK_STATUS_CREATE_FAILED = 3;
  STACK_STATUS_UPDATE_IN_PROGRESS = 4;
  STACK_STATUS_UPDATE_COMPLETE = 5;
  STACK_STATUS_UPDATE_COMPLETE_CLEANUP_IN_PROGRESS = 6;
  STACK_STATUS_UPDATE_FAILED = 7;
  STACK_STATUS_UPDATE_ROLLBACK_IN_PROGRESS = 8;
  STACK_STATUS_UPDATE_ROLLBACK_COMPLETE = 9;
  STACK_STATUS_ROLLBACK_IN_PROGRESS = 10;
  STACK_STATUS_ROLLBACK_FAILED = 11;
  STACK_STATUS_ROLLBACK_COMPLETE = 12;
  STACK_STATUS_DELETE_IN_PROGRESS = 13;
  STACK_STATUS_DELETE_FAILED = 14;
  STACK_STATUS_DELETE_COMPLETE = 15;
  STACK_STATUS_UPDATE_ROLLBACK_FAILED = 16;
  STACK_STATUS_UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS = 17;
  STACK_STATUS_REVIEW_IN_PROGRESS = 18;
  STACK_STATUS_IMPORT_IN_PROGRESS = 19;
  STACK_STATUS_IMPORT_COMPLETE = 20;
  STACK_STATUS_IMPORT_ROLLBACK_IN_PROGRESS = 21;
  STACK_STATUS_IMPORT_ROLLBACK_FAILED = 22;
  STACK_STATUS_IMPORT_ROLLBACK_COMPLETE = 23;
}
