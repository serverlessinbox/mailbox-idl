syntax = "proto3";

package common.v1;

import "google/protobuf/timestamp.proto";

// ============================================
// Shared Enums
// ============================================

// AccountCapability enumerates the JMAP capability URIs that can be provisioned for an account.
// These map to the standard JMAP capability identifiers used in session/account responses.
//
// URI mappings:
//   - ACCOUNT_CAPABILITY_MAIL      → "urn:ietf:params:jmap:mail"      (RFC 8621)
//   - ACCOUNT_CAPABILITY_CONTACTS  → "urn:ietf:params:jmap:contacts"  (RFC 9610)
//   - ACCOUNT_CAPABILITY_CALENDARS → "urn:ietf:params:jmap:calendars"
//
// Use AccountCapability values wherever a JMAP capability URI is required.
enum AccountCapability {
  ACCOUNT_CAPABILITY_UNSPECIFIED = 0;
  ACCOUNT_CAPABILITY_MAIL = 1;       // Enables JMAP mail, mailbox and email submission methods.
  ACCOUNT_CAPABILITY_CONTACTS = 2;   // Enables JMAP contacts (AddressBook + ContactCard) methods.
  ACCOUNT_CAPABILITY_CALENDARS = 3;  // Enables JMAP calendar methods (reserved for future use).
}

// VerificationStatus indicates the verification state of a domain or email identity.
// Used across multiple services to represent email verification progress.
//
// Client Usage:
//   - PENDING: Initial state, verification process is in progress
//   - SUCCESS: Verification completed successfully, identity is ready for email sending
//   - FAILED: Verification failed, may need to retry or reconfigure
//   - UNSPECIFIED: Unknown or error state, should not occur in normal operation
enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_PENDING = 1;
  VERIFICATION_STATUS_SUCCESS = 2;
  VERIFICATION_STATUS_FAILED = 3;
}

// MessageClass represents the category/purpose of an email message
// Used for tracking bounces and complaints per message type
enum MessageClass {
  MESSAGE_CLASS_UNSPECIFIED = 0;
  MESSAGE_CLASS_TRANSACTIONAL = 1;  // Transactional emails (receipts, confirmations, etc.)
  MESSAGE_CLASS_MAILING_LIST = 2;   // Mailing list emails
  MESSAGE_CLASS_BULK = 3;           // Bulk/marketing emails
}

// Account is the shared account representation used across admin API services.
message Account {
  // account_id: Unique account identifier (acc_ prefix).
  string account_id = 1;
  // name: Human-readable display name / local-part of the primary email.
  string name = 2;
  // email: Primary email address derived from the account's primary alias.
  string email = 3;
  // capabilities: JMAP capability URIs provisioned for this account.
  // Values correspond to AccountCapability enum URIs (e.g. "urn:ietf:params:jmap:mail").
  repeated string capabilities = 4;
  // owner_principal_id: The principal (user_ or grp_) that owns this account.
  string owner_principal_id = 5;
}

// ============================================
// Shared Errors
// ============================================

// ErrorCode is the closed set of error categories. Each maps to one HTTP status. Clients branch on it.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;        // 400
  ERROR_CODE_UNAUTHENTICATED = 2;         // 401
  ERROR_CODE_FORBIDDEN = 3;               // 403
  ERROR_CODE_NOT_FOUND = 4;               // 404
  ERROR_CODE_METHOD_NOT_ALLOWED = 5;      // 405
  ERROR_CODE_CONFLICT = 6;                // 409
  ERROR_CODE_UNSUPPORTED_MEDIA_TYPE = 7;  // 415
  ERROR_CODE_INTERNAL = 8;                // 500
}

// ErrorReason says why a CONFLICT was refused. It is UNSPECIFIED for every other code and for a conflict with no listed reason.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_ALREADY_ACTIVE = 1;  // An equivalent operation is already in progress.
  ERROR_REASON_LIMIT_REACHED = 2;   // A quota or a rate cap is reached; the called operation says which one.
  ERROR_REASON_COOLDOWN = 3;        // The caller must wait; retry_at says until when.
  ERROR_REASON_BUSY = 4;            // The server is temporarily saturated; retry shortly.
  ERROR_REASON_INVALID_STATE = 5;   // The resource's current state does not allow the operation.
}

// FieldViolation names one request field that was refused.
message FieldViolation {
  // field: The request field's proto name (snake_case).
  string field = 1;
  // description: Human-readable reason. Its wording is not stable.
  string description = 2;
}

// ErrorResponse is the body of every non-2xx response.
message ErrorResponse {
  // code: Machine-readable error category. Clients branch on it.
  ErrorCode code = 1;
  // message: Human-readable description of the failure. Its wording is not stable; do not parse it.
  string message = 2;
  // reason: Set on CONFLICT only. Clients branch on it.
  ErrorReason reason = 3;
  // retry_at: Set with ERROR_REASON_COOLDOWN: the earliest instant the same request can succeed.
  google.protobuf.Timestamp retry_at = 4;
  // violations: Set on INVALID_ARGUMENT when the refused fields are known. Never carries the submitted value.
  repeated FieldViolation violations = 5;
}
