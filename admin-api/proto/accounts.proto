syntax = "proto3";

package accounts.v1;

import "validate/validate.proto";

option go_package = "admin-api/generated/accounts;accountsv1";

// AccountsService provides operations for managing accounts.
service AccountsService {
  // ListAccounts retrieves all accounts with pagination.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // GetAccount retrieves a specific account by ID.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);

  // CreateAccount creates a new account for a user.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);

  // UpdateAccount updates account properties.
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);

  // DeleteAccount deletes an account and all associated data (aliases, mailboxes, emails).
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  // ListAccountMembers lists all ACL members of an account.
  rpc ListAccountMembers(ListAccountMembersRequest) returns (ListAccountMembersResponse);

  // PutAccountMember creates or updates a user's role on an account.
  rpc PutAccountMember(PutAccountMemberRequest) returns (PutAccountMemberResponse);

  // DeleteAccountMember removes a user from an account ACL.
  rpc DeleteAccountMember(DeleteAccountMemberRequest) returns (DeleteAccountMemberResponse);
}

enum AccountRole {
  ACCOUNT_ROLE_UNSPECIFIED = 0;
  ACCOUNT_ROLE_READ = 1;   // Can read email and mailboxes
  ACCOUNT_ROLE_WRITE = 2;  // Can create, update, and delete email
  ACCOUNT_ROLE_ADMIN = 3;  // Full access including managing aliases and account settings
}

message AccountMember {
  // account_id: The account this membership belongs to.
  string account_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
  // user_id: The user who holds this membership.
  string user_id = 2 [(validate.rules).string = {
    min_len: 1
    pattern: "^user_[a-zA-Z0-9_-]{21}$"
  }];
  // role: The access level granted to this user.
  AccountRole role = 3 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
}

message ListAccountMembersRequest {
  string account_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
}

message ListAccountMembersResponse {
  repeated AccountMember members = 1;
}

message PutAccountMemberRequest {
  string account_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
  string user_id = 2 [(validate.rules).string = {
    min_len: 1
    pattern: "^user_[a-zA-Z0-9_-]{21}$"
  }];
  AccountRole role = 3 [(validate.rules).enum = {defined_only: true, not_in: [0]}];
}

message PutAccountMemberResponse {
  AccountMember member = 1;
}

message DeleteAccountMemberRequest {
  string account_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
  string user_id = 2 [(validate.rules).string = {
    min_len: 1
    pattern: "^user_[a-zA-Z0-9_-]{21}$"
  }];
}

message DeleteAccountMemberResponse {}

message Account {
  // account_id: Unique account identifier (acc_ prefix).
  string account_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
  // type: Account type — "personal" for single-user mailboxes, "shared" for team accounts.
  string type = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 50
  }];
  // name: Human-readable display name for this account.
  string name = 3 [(validate.rules).string = {
    min_len: 1
    max_len: 255
  }];
  // email: Primary email address (the account's default sending alias).
  string email = 4 [(validate.rules).string = {
    email: true
    max_len: 255
  }];
  // shared: True if this account has more than one member.
  bool shared = 5;
}

message ListAccountsRequest {
  // page_size: Maximum number of accounts per page (1–1000, default 50).
  optional int32 page_size = 1 [(validate.rules).int32 = {gte: 1, lte: 1000}];
  // page_token: Token from previous response to fetch the next page.
  optional string page_token = 2 [(validate.rules).string.max_len = 512];
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  // next_page_token: Pass to the next request to get the following page. Empty means no more pages.
  string next_page_token = 2;
}

message GetAccountRequest {
  string account_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
}

message GetAccountResponse {
  Account account = 1;
}

message CreateAccountRequest {
  // user_id: The user who will own this account.
  string user_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^user_[a-zA-Z0-9_-]{21}$"
  }];
  // name: Display name for the account.
  string name = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];

  // The primary alias for this account will be constructed as:
  //   <local_part>@<domain.domain>
  // where domain_id refers to a configured domain in DynamoDB.
  string local_part = 3 [(validate.rules).string = {
    min_len: 1
    max_len: 64
    pattern: "^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+$"
  }];
  // domain_id: Domain for the primary alias (must be a configured sending domain).
  string domain_id = 4 [(validate.rules).string = {
    min_len: 1
    pattern: "^dom_[a-zA-Z0-9_-]{21}$"
  }];
}

message CreateAccountResponse {
  Account account = 1;
}

message UpdateAccountRequest {
  string account_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
  // name: New display name for the account.
  optional string name = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
}

message UpdateAccountResponse {
  Account account = 1;
}

message DeleteAccountRequest {
  string account_id = 1 [(validate.rules).string = {
    min_len: 1
    pattern: "^acc_[a-zA-Z0-9_-]{21}$"
  }];
}

message DeleteAccountResponse {}
