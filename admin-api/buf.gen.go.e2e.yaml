# buf.gen.go.e2e.yaml - Go E2E SDK generation (protobuf types + HTTP client)
version: v2

plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=e2e-tests

  - local: ["../tools/protoc-gen-go-interface/protoc-gen-go-interface"]
    out: .
    opt:
      - module=e2e-tests

  - local: ["../tools/protoc-gen-go-http-client/protoc-gen-go-http-client"]
    out: .
    opt:
      - client_mode=external
      - client_package=adminclient
      - client_filename=generated/adminclient/admin_api_http_client.pb.go
      - compound_client=true
      - compound_client_filename=generated/adminclient/admin_api_client.pb.go
