# buf.gen.ts.yaml - TypeScript SDK generation (from protobuf)
version: v2
managed:
  enabled: true
  # The go_package overrides below are required even though this template generates
  # TypeScript output: the remote buf.build/bufbuild/es plugin and the local
  # protoc-gen-ts-client plugin are both Go-based tooling and refuse to run without a
  # resolvable go_package option on every file. The path value itself has no effect on
  # the generated TS.
  disable:
    - file_option: java_package
    - file_option: java_outer_classname
    - file_option: java_multiple_files
    - file_option: java_string_check_utf8
    - file_option: objc_class_prefix
    - file_option: csharp_namespace
    - file_option: php_namespace
    - file_option: php_metadata_namespace
    - file_option: ruby_package
    - file_option: optimize_for
    - file_option: cc_enable_arenas
  override:
    - file_option: go_package
      path: aliases.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/aliases;aliasesv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: audit.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/audit;auditv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: change_requests.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/ops;opsv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: common.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/common;commonv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: domains.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/domains;domainsv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: email_identities.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/email_identities;email_identitiesv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: groups.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/groups;groupsv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: idp_users.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/idp_users;idp_usersv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: mail_feedback.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/mail_feedback;mail_feedbackv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: monitoring.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/monitoring;monitoringv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: resource_accounts.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/resource_accounts;resourceaccountsv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: setup.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/setup;setupv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: stack_update.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/stack_update;stackupdatev1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: status.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/status;statusv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: support.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/support;supportv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: suppression.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/suppression;suppressionv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
    - file_option: go_package
      path: users.proto
      value: github.com/serverlessinbox/mailbox-idl/admin-api/users;usersv1
      module: buf.build/serverlessinbox/mailbox-idl-admin-api
plugins:
  - remote: buf.build/bufbuild/es:v2.15.0
    out: .
    include_imports: true
    opt:
      - target=ts

  - local: ["tools/protoc-gen-ts-client/protoc-gen-ts-client"]
    out: .
    strategy: all
    opt:
      - paths=source_relative
